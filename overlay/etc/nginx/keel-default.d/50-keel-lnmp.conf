# keel-lnmp: the check page of Keel LNMP (handbook decision 0059, point 6).
#
# keel-web 0.3.0 includes this directory in its default site, on 80 and 443,
# and in the server behind Anubis (unix:/run/nginx/keel-app.sock), so the
# page answers in the simple mode and behind Anubis in the cloud modes.
#
# Only one file runs: /keel-check/index.php, through PHP-FPM on Debian's
# socket of the default PHP version (/run/php/php-fpm.sock, an alternative
# that the php8.4-fpm unit installs at its start). Nothing else under
# /usr/share/keel-lnmp/www is given to PHP. The page only reads from
# MariaDB, as the user of PHP-FPM, www-data, which the server knows by
# its socket (unix_socket): there is no password to keep.

location = /keel-check {
	return 301 /keel-check/;
}

location ^~ /keel-check/ {
	root /usr/share/keel-lnmp/www;
	index index.php;

	location = /keel-check/index.php {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php-fpm.sock;
	}
}
