# The commissioning contract of keel-lnmp (handbook decision 0075). The
# shared runner, bin/keel-commission of Keel-Linux/.github, reads it. It makes
# a container from the template on a Proxmox host as an operator does,
# answers the first boot, and then checks what this file says. The CI job
# "commission / contract" checks only that this file is valid.
#
# A new first boot question or a new secret is a change of this file in the
# same pull request (0075, Consequences).
#
# The check page /keel-check/ and its database keel_check are part of the
# LNMP product: decision 0059, point 6, says that each stack has a check page
# that proves each layer (nginx, PHP-FPM, MariaDB) and, on a pair, the
# replication. The page only reads, as www-data over the socket, and holds no
# secret. So here they must be present. An application on top of lnmp
# (WordPress, Laravel) removes both, and its own contract forbids them.
contract: 1
appliance: lnmp
secrets: [root, db]
# The prompts are the titles on the screen of keel-init. A password menu of
# the same title (Generate or Manual) gets Manual from the runner, then the
# answer goes into the password box and its confirmation.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  # bin/dbpass.py: the password of the MariaDB account admin
  - id: db_password
    hook: 35mysqlpass
    prompt: MariaDB password
    answer: secret:db
  # The Mode screen of decision 0076, the first step of 75keel-role.
  # Simple is its first entry. A described installation.mode skips it.
  - id: mode
    hook: 75keel-role
    prompt: Installation mode
    type: choice
    answer: '{ret}'
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of keel-lnmp, with the secrets of the run and no
# instance name: the machine keeps the name that pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: lnmp
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
    nginx: enabled
    coraza: disabled
    anubis: disabled
    syncthing: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  app:
    options:
      db_user: admin
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  # a TCP login of admin, on the address that 35mysqlpass verifies (::1) and
  # on IPv4, both hosts the hook configures
  - {secret: db, kind: mysql, user: admin, host: '::1'}
  - {secret: db, kind: mysql, user: admin, host: 127.0.0.1}
services: [nginx, mariadb, php8.4-fpm, ssh, webmin, postfix, cron, monit]
urls:
  - {url: 'https://127.0.0.1/', status: 200}
  # nginx, PHP-FPM and MariaDB answer together (0059, point 6)
  - {url: 'https://127.0.0.1/keel-check/', status: 200}
  # port 80 of the loopback is keel-default's (keel-web 0.4.0, handbook
  # decision 0079): with the self-signed certificate of the first boot it
  # serves the site and the check page as 443 does, with no redirect, and
  # /keel-health 204 for the monitor
  - {url: 'http://127.0.0.1/', status: 200}
  - {url: 'http://127.0.0.1/keel-check/', status: 200}
  - {url: 'http://127.0.0.1/keel-health', status: 204}
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  # the build tools of a layer stay on the build host
  - {kind: path, name: /usr/local/lib/keel-build}
  # the test database of a MariaDB installation: Debian makes none, and an
  # image must not carry one
  - {kind: mysql-database, name: test}
  # no PHP information page: it shows the configuration to anybody
  - {kind: path, name: /var/www/keel-default/info.php}
  - {kind: path, name: /var/www/html/info.php}
# The web pages of the gallery (decisions 0075 and 0077): the default site,
# the check page of the stack, and Webmin before and after the login with
# the root secret. LNMP has no application back end of its own.
screenshots:
  - {name: site, url: /}
  - {name: keel-check, url: /keel-check/}
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    wait: 8
    # the shot waits for the dashboard, which comes after the page
    # (VMs of BR2, 2026-11-06)
    text: System hostname

# The cloud modes (decision 0076): cloud simple is a primary on BR1 and a
# replica on BR2. The prompts are the titles of the confconsole screens,
# which are data here: a new title is a change of this file, not of
# keel-commission. A node's answer of the id mode replaces the question
# mode above (keel-commission, .github#45). The vm-iso pass takes the
# default screens of tkl-installer (no vm section).
cloud:
  capture:
    # keel1: an invite without a VIP, keel2: one that carries it (keel 0.23.83)
    invite: 'keel[12]:[A-Za-z0-9_.~+/=-]+'
    # the label anchors it: the usage screen shows the node's own addresses too
    vip: 'VIP:? +([0-9a-f]{1,4}(:[0-9a-f]{0,4}){2,7})'
  # the screens on which a node waits for another: no key while they are up
  waits: [Waiting for the nodes]
  # the proofs across the pair, in order ("carried here: yes" on the node
  # that holds the VIP, keel 0.23.83)
  checks:
    - {id: vip-holder, at: all, run: 'keel vip status', match: 'carried here: yes', count: 1}
    # the replica holds the primary's data, made before the pair formed:
    # the rows of keel_check.boot are the primary's on both nodes (keel
    # 0.23.84 seeds a replica at its first pairing; before it the replica
    # kept its own first-boot row, BR1 and BR2, 2026-11-06)
    - {id: seeded, at: 'primary,replica', run: 'mysql -N -e "SELECT host FROM keel_check.boot ORDER BY host"', same: true}
    - {id: row-written, at: primary, run: 'mysql -e "CREATE DATABASE IF NOT EXISTS kc_probe; CREATE TABLE IF NOT EXISTS kc_probe.t (v INT); INSERT INTO kc_probe.t VALUES (42)"'}
    - {id: row-replicated, at: replica, run: 'sleep 5; mysql -N -e "SELECT v FROM kc_probe.t"', match: '^42$'}
    - {id: replica-read-only, at: replica, run: 'mysql -N -e "SELECT @@global.read_only"', match: '^1$'}
    # Syncthing replicates the state paths of the manifests (0050)
    - {id: files-follow, at: replica, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'receiveonly'}
    - {id: files-sent, at: primary, run: 'k=$(cat /var/lib/keel/filesync/apikey); curl -s -H "X-API-Key: $k" http://127.0.0.1:8384/rest/config/folders', match: 'sendonly'}
    - {id: promote, at: replica, run: 'keel vip promote'}
    - {id: promoted-holder, at: replica, run: 'keel vip status', match: 'carried here: yes'}
    # the old primary replicates from the new one and has applied all it
    # received before it takes the VIP back: a return promote before that
    # can leave no writable server or split the data (keel 0.23.84)
    - {id: old-primary-follows, at: primary, run: 'for i in $(seq 60); do s=$(mysql -e "SHOW SLAVE STATUS\\G"); grep -q "Slave_SQL_Running: Yes" <<< "$s" && grep -q "Seconds_Behind_Master: 0" <<< "$s" && grep -q "has read all relay log" <<< "$s" && echo caught-up && exit 0; sleep 5; done; exit 1', match: '^caught-up$'}
    - {id: return, at: primary, run: 'keel vip promote'}
    - {id: returned-holder, at: primary, run: 'keel vip status', match: 'carried here: yes'}
    - {id: probe-dropped, at: primary, run: 'mysql -e "DROP DATABASE kc_probe"'}
    # no unit failed on either node: the cloud modes start overlays (anubis,
    # coraza, crowdsec, syncthing) that services: does not name
    - {id: no-failed-units, at: all, run: 'systemctl --failed --no-legend --plain | wc -l', match: '^0$', count: 2}
nodes:
  - name: primary
    site: br1
    mode: cloud_simple
    role: primary
    # the hotkeys of the menus (the first letter of an item): an arrow key is
    # an escape sequence, and the console of a container can hand dialog its
    # ESC alone, which cancels the screen (BR1, 2026-11-06)
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'P{ret}'}
      - {id: invite, prompt: Invite a node, keys: '{ret}'}
  - name: replica
    site: br2
    mode: cloud_simple
    role: replica
    answers:
      - {id: mode, prompt: Installation mode, keys: 'C{ret}'}
      - {id: role, prompt: Role of this node, keys: 'R{ret}'}
      - {id: join, prompt: Join a mesh, keys: '{invite:1}{ret}'}
