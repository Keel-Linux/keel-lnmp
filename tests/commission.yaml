# The commissioning contract of keel-lnmp (handbook decision 0075). The
# shared runner, bin/keel-commission of Keel-Linux/.github, reads it. It makes
# a container from the template on a Proxmox host as an operator does,
# answers the first boot, and then checks what this file says. The CI job
# "commission / contract" checks only that this file is valid.
#
# A new first boot question or a new secret is a change of this file in the
# same pull request (0075, Consequences).
#
# The check page /keel-check/ and its database keel_check are part of the
# LNMP product: decision 0059, point 6, says that each stack has a check page
# that proves each layer (nginx, PHP-FPM, MariaDB) and, on a pair, the
# replication. The page only reads, as www-data over the socket, and holds no
# secret. So here they must be present. An application on top of lnmp
# (WordPress, Laravel) removes both, and its own contract forbids them.
contract: 1
appliance: lnmp
secrets: [root, db]
# The prompts are the titles on the screen of keel-init. A password menu of
# the same title (Generate or Manual) gets Manual from the runner, then the
# answer goes into the password box and its confirmation.
questions:
  - id: root_password
    hook: 30rootpass
    prompt: Root Password
    answer: secret:root
  # bin/dbpass.py: the password of the MariaDB account admin
  - id: db_password
    hook: 35mysqlpass
    prompt: MariaDB password
    answer: secret:db
  # The Mode screen of decision 0076, the first step of 75keel-role.
  # Simple is its first entry. A described installation.mode skips it.
  - id: mode
    hook: 75keel-role
    prompt: Installation mode
    type: choice
    answer: '{ret}'
  - id: alert_email
    hook: 85secalerts
    prompt: System Notifications
    answer: admin@example.org
# keel/instance.example.yaml of keel-lnmp, with the secrets of the run and no
# instance name: the machine keeps the name that pct create gave it
instance:
  version: 1
  network:
    managed_by: host
    interfaces:
      eth0:
        ipv6:
          method: auto
  tls:
    acme:
      enabled: false
  appliance:
    name: lnmp
  installation:
    mode: simple
  overlays:
    installer: enabled
    wireguard: disabled
    etcd: disabled
    crowdsec: disabled
    vip: disabled
    nginx: enabled
    coraza: disabled
    anubis: disabled
    syncthing: disabled
  secrets:
    root_password: secret:root
    db_password: secret:db
  app:
    options:
      db_user: admin
  hub:
    api_key: skip
  security:
    alerts: admin@example.org
    updates_at_first_boot: skip
  first_login_wizard: false
proofs:
  - {secret: root, kind: shadow, user: root}
  # a TCP login of admin, on the address that 35mysqlpass verifies (::1) and
  # on IPv4, both hosts the hook configures
  - {secret: db, kind: mysql, user: admin, host: '::1'}
  - {secret: db, kind: mysql, user: admin, host: 127.0.0.1}
services: [nginx, mariadb, php8.4-fpm, ssh, webmin, postfix, cron, monit]
urls:
  - {url: 'https://127.0.0.1/', status: 200}
  # nginx, PHP-FPM and MariaDB answer together (0059, point 6)
  - {url: 'https://127.0.0.1/keel-check/', status: 200}
  - {url: 'https://127.0.0.1:12321/', status: 200}
forbidden:
  # the build tools of a layer stay on the build host
  - {kind: path, name: /usr/local/lib/keel-build}
  # the test database of a MariaDB installation: Debian makes none, and an
  # image must not carry one
  - {kind: mysql-database, name: test}
  # no PHP information page: it shows the configuration to anybody
  - {kind: path, name: /var/www/keel-default/info.php}
  - {kind: path, name: /var/www/html/info.php}
# The web pages of the gallery (decisions 0075 and 0077): the default site,
# the check page of the stack, and Webmin before and after the login with
# the root secret. LNMP has no application back end of its own.
screenshots:
  - {name: site, url: /}
  - {name: keel-check, url: /keel-check/}
  - name: webmin
    port: 12321
    url: /
    login: {user_field: 'input[name=user]', user: root, password_field: 'input[name=pass]', secret: root, submit: 'button[type=submit]'}
    wait: 8
